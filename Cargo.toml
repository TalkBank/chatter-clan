[workspace]
resolver = "2"
members = ["crates/talkbank-clan", "crates/chatter-clan-cli"]

# chatter-clan is the standalone CLAN reimplementation extracted from the
# chatter repo on 2026-06-15. It resumed active development on 2026-10-30 and
# remains a separate repository rather than returning to the chatter workspace.
#
# The CHAT core (talkbank-model / talkbank-transform and their transitive crates)
# lives in the public chatter repo and is consumed via git deps pinned to a
# release tag, the same pattern talkbank-tools uses. Keep both dependencies on
# the latest published chatter release; a pin update may surface API drift that
# must be fixed in the same change.

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Franklin Chen <franklinchen@franklinchen.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TalkBank/chatter-clan"
homepage = "https://talkbank.org/"
keywords = ["talkbank", "chat-format", "clan", "linguistics", "nlp"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
# The standalone CLI driver (chatter-clan binary) consumes the analysis engine
# from the sibling library crate, plus clap for argument parsing.
talkbank-clan = { path = "crates/talkbank-clan" }
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4"

# crates.io dependencies the talkbank-clan crate uses.
comrak = "0.59.0"
indexmap = { version = "2.14", features = ["serde"] }
insta = { version = "1.49", features = ["json", "yaml"] }
quick-xml = "0.42"
rand = "0.10"
schemars = { version = "1.2", features = ["indexmap2", "smol_str03"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = { version = "1.16", features = ["serde", "union", "const_generics"] }
tempfile = "3.27"
thiserror = "^2.0.21"
tracing = "0.1"
walkdir = "^2.5"

# CHAT core consumed from the public chatter repo at the current release tag.
# talkbank-transform transitively pulls talkbank-parser / talkbank-cache /
# talkbank-derive / tree-sitter-talkbank from the same git source.
talkbank-model = { git = "https://github.com/TalkBank/chatter", tag = "v0.34.3" }
talkbank-transform = { git = "https://github.com/TalkBank/chatter", tag = "v0.34.3" }

[profile.release]
# Lean release profile, matching chatter.
